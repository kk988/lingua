name: Lingua
options:
  bundleIdPrefix: com.example
  xcodeVersion: "15.4"
settings:
  base:
    SWIFT_VERSION: 5.10
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0

targets:
  Lingua:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lingua
    info:
      path: Lingua/Support/Info.plist
    entitlements:
      path: Lingua/Support/Lingua.entitlements
    settings:
      base:
        PRODUCT_NAME: Lingua
        PRODUCT_MODULE_NAME: Lingua
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Lingua
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Lingua/Support/Lingua.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Lingua
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  LinguaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_NAME: LinguaTests
        PRODUCT_MODULE_NAME: LinguaTests
    sources:
      - path: LinguaTests
    dependencies:
      - target: Lingua
