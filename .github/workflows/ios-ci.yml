name: iOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew update
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        run: |
          rm -rf Lingua.xcodeproj
          xcodegen generate --spec project.yml

      - name: Inspect generated project format
        run: |
          /usr/libexec/PlistBuddy -c 'Print :objectVersion' Lingua.xcodeproj/project.pbxproj || true

      - name: Resolve simulator destination
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 16 \(/ { print $(NF-1); exit }')

          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone [0-9]+/ { print $(NF-1); exit }')
          fi

          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi

          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          echo "Using simulator UDID: $UDID"

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Lingua.xcodeproj \
            -scheme Lingua \
            -destination "id=${SIMULATOR_UDID}" \
            CODE_SIGNING_ALLOWED=NO
