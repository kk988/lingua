name: iOS CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew update
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate project
        run: |
          rm -rf Lingua.xcodeproj
          xcodegen generate --spec project.yml

      - name: Inspect generated project format
        run: |
          /usr/libexec/PlistBuddy -c 'Print :objectVersion' Lingua.xcodeproj/project.pbxproj || true

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Lingua.xcodeproj \
            -scheme Lingua \
            -destination "platform=iOS Simulator,name=iPhone 15" \
            CODE_SIGNING_ALLOWED=NO
